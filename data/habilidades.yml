# Buckets de habilidades. Cada bucket tem um rótulo e uma lista de skills
# como strings simples. O manifesto seleciona quais buckets entram por
# vaga. Lista curada: prioriza o que é sustentável em entrevista e pedido
# pela vaga-alvo, evitando empilhamento para ATS.
buckets:
  - rotulo: Backend (JVM)
    itens:
      - "Java (11/16/17/21)"
      - "Spring Boot (2.x e 3.x)"
      - "Spring Data JPA, Spring Security"
      - "Spring Cloud (Eureka, Feign)"
      - "Spring WebFlux"

  - rotulo: Persistência
    itens:
      - "PostgreSQL, MySQL"
      - "Hibernate/JPA, Hibernate Envers (auditoria)"
      - "Flyway (migrations)"
      - "QueryDSL"
      - "SQL nativo"

  - rotulo: Mensageria e Integração
    itens:
      - "Apache Camel"
      - "AWS SQS"
      - "Redis (cache e pub/sub)"
      - "WebSocket (STOMP/SockJS)"

  - rotulo: Frontend
    itens:
      - "Angular (13 a 20)"
      - "React (17/18/19)"
      - "Vue 2"
      - "React Native/Expo"
      - "Vite, MapLibre/Leaflet"

  - rotulo: Cloud/DevOps e observabilidade
    itens:
      - "AWS (S3, SQS, ECS, ECR, CloudFront, Cognito, Lambda, RDS)"
      - "Docker, Terraform"
      - "GitLab CI/CD"
      - "Sentry, OpenTelemetry"

  - rotulo: Testes
    itens:
      - "JUnit, Mockito, AssertJ"
      - "Testcontainers, WireMock"
      - "Cypress (E2E), Vitest, Jest"

  - rotulo: APIs, contratos e auth
    itens:
      - "REST, OpenAPI/Swagger"
      - "GraphQL (cliente)"
      - "JWT (jjwt)"
      - "Keycloak (OAuth2/OIDC), AWS Cognito"

  - rotulo: Metodologia e soft skills
    itens:
      - "Kanban (Redmine, ClickUp)"
      - "Code review com padrões definidos pelo time"
      - "Análise de causa raiz (RCA) de incidentes em produção"
      - "Mentoria de juniores em Clean Architecture"
      - "Levantamento de requisitos com cliente (7 domínios)"

  - rotulo: Documentos/Dados
    itens:
      - "Apache POI (Excel)"
      - "iText/PDFBox (PDF)"
      - "OpenCSV"
      - "Velocity (templates)"

  - rotulo: IA aplicada
    itens:
      - "Benchmark de modelos de embedding para RAG (MRR, Recall@K, nDCG@10)"
      - "Engenharia agentic (Context Engineering, Skills, MCPs, Subagents)"
