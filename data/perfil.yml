# Identidade da pessoa e parágrafos de perfil para o topo do curriculo.
pessoa:
  nome: Candidato Nome Completo
  cargo_apresentacao: Engenheiro de Software Pleno
  contato:
    telefone: "(00) 00000-0000"
    email: candidato.exemplo@dominio.com
    localizacao: Cidade, UF
    linkedin: linkedin.com/in/seu-perfil/
    github: github.com/seu-usuario
    portfolio: seu-portfolio.com/portfolio/seu-usuario

# Perfis alternativos por chave. O manifesto de seleção escolhe um pela
# chave (`perfil_chave`). Adicione novos perfis conforme surgirem vagas
# com personas diferentes (backend puro, frontend, IA, etc.).
perfis:
  generico: >
    Engenheiro de Software Pleno com 5 anos de experiência em
    desenvolvimento Full Stack focado em Java/Spring, Clean Architecture
    e design de código. Passagem por sete domínios de negócio distintos
    (agronegócio, fintech, logística, automotivo, gamificação corporativa,
    compliance e educação). Bacharel em Ciência da Computação pela UFPA
    (2024).
  fullstack: >
    Engenheiro de Software Pleno com 5 anos de experiência em entregas
    full-stack end-to-end em Java/Spring e Angular/React, com passagem
    por 7 domínios de negócio em consultoria e produto. Bacharel em
    Ciência da Computação pela UFPA (2024).
  backend: >
    Engenheiro de Software Pleno com 5 anos de experiência em backend
    Java/Spring (Clean Architecture, CQRS-lite, multi-tenancy,
    mensageria em Camel e SQS), atuando em 7 domínios de negócio.
    Bacharel em Ciência da Computação pela UFPA (2024).

