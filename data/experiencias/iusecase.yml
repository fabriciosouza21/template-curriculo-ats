# Passagem pela iUsecase (Jul 2025 - atual). Case principal: Consol.
empresa: iUsecase Tecnologia e Inovação
cargo: Desenvolvedor Backend Pleno 1            # cargo CTPS (formal, CBO 2124-05)
cargo_apresentacao: Engenheiro de Software Pleno # cargo no cabeçalho do curriculo
periodo:
  inicio: 2025-07
  fim: atual
local: Belo Horizonte, MG (remoto)
contexto: >
  Atuação remota em três produtos com foco em design de código e
  arquitetura limpa.

cases:
  - produto: Consol
    dominio: fiscalização de malha rodoviária
    destaque: true    # prioridade máxima: entra sempre salvo incompatibilidade
                      # forte com a vaga (ex.: case backend em vaga só mobile)
    descricao: >
      Desenvolvi backend para fiscalização de malha rodoviária atendendo 3
      contratos que cobriam 14 rodovias e 138 segmentos em Minas Gerais,
      com dados geoespaciais e sincronização mobile offline-first.

  - produto: Apontamento
    dominio: timesheet multi-tenant
    descricao: >
      Modelei sistema de timesheet multi-tenant servindo 4 empresas e 28
      clientes de infraestrutura (DNIT, DER/SP, INVEPAR), com motor de
      regras configuráveis por cliente e cache para reduzir custo.
      Initiative e Workbook ainda pendentes (dívida documentada).

  - produto: Live2U
    dominio: clínicas e saúde
    descricao: >
      Construí plataforma de saúde multi-tenant com 3 clínicas, migração
      de 13.416 beneficiários, 31 especialidades e integrações com
      operadora TopMed, marketplace Alloyal e WhatsApp. O backend de IA
      é externo (operado pela Sys3); meu trabalho foi a orquestração.

transversais:
  - >
    Mantive CI/CD em GitLab com deploy para ECS via ECR e S3 com
    CloudFront, cultura de testes com Testcontainers e AssertJ, e
    suporte a produção com análise de causa raiz (RCA) de incidentes.
  - >
    Participei de decisões de arquitetura e mentorei desenvolvedores
    juniores em Clean Architecture e revisão de código.
