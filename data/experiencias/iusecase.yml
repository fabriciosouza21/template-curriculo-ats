# Passagem pela iUsecase (Jul 2025 - atual). Case principal: Consol.
empresa: iUsecase Tecnologia e Inovação
cargo: Desenvolvedor Backend Pleno 1            # cargo CTPS (formal, CBO 2124-05)
cargo_apresentacao: Engenheiro de Software Pleno # cargo no cabeçalho do curriculo
periodo:
  inicio: 2025-07
  fim: atual
local: Belo Horizonte, MG (remoto)
contexto: >
  Atuação remota em três produtos com foco em design de código e
  arquitetura limpa.

cases:
  - produto: Consol
    dominio: fiscalização de malha rodoviária
    destaque: true    # prioridade máxima: entra sempre salvo incompatibilidade
                      # forte com a vaga (ex.: case backend em vaga só mobile)
    descricao: >
      Desenvolvi backend em Spring Boot 3.2 e Java 21 em Clean Architecture
      com CQRS-lite, usando hibernate-spatial/JTS para geometria rodoviária
      e sincronização mobile offline-first com lock em Redis. Frontend em
      React 19 e mobile em Flutter.

  - produto: Apontamento
    dominio: timesheet multi-tenant
    descricao: >
      Modelei arquitetura multi-tenant database-driven com policies em
      banco e resolvers @Cacheable em Caffeine. Migrei o módulo de
      timelogging para eliminar condicionais de cliente; Initiative e
      Workbook ainda pendentes (dívida documentada). Spring Boot 3.2,
      Java 17, QueryDSL e Angular 17.

  - produto: Live2U
    dominio: clínicas e saúde
    descricao: >
      Integrei serviço externo de RAG sobre exames no frontend Angular,
      com upload de PDF e jobs assíncronos com polling. Backend Spring
      Boot 3.2 com Java 21 e jOOQ. O backend de IA é externo (operado
      pela Sys3); meu trabalho foi a orquestração e integração.

transversais:
  - >
    Mantive CI/CD em GitLab com deploy de imagens ARM64 para ECS via ECR
    e S3 com CloudFront, cultura de testes com Testcontainers e AssertJ,
    e suporte a produção com análise de causa raiz (RCA) de incidentes.
  - >
    Participei de decisões de arquitetura (multi-tenant, escolha entre
    JPA/QueryDSL/jOOQ) e mentorei desenvolvedores juniores em Clean
    Architecture e revisão de código.
