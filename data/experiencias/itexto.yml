# Passagem pela itexto (Out 2021 - Abr 2025). Case principal: Weex.
empresa: itexto Consultoria em Tecnologia
cargo: Programador                              # cargo CTPS (formal, CBO 3171-10)
cargo_apresentacao: Desenvolvedor Full Stack Pleno # função real exercida
periodo:
  inicio: 2021-10
  fim: 2025-04
local: Belo Horizonte, MG
contexto: >
  Atuação full stack em ciclo completo de software em consultoria, com
  passagem por sete domínios de negócio (gamificação corporativa, crédito
  rural, barter agrícola, fintech, logística, compliance e educação).

cases:
  - produto: Weex
    dominio: gamificação corporativa e eventos
    destaque: true    # case principal: 3,5 anos de atuação contínua
    descricao: >
      Desenvolvi por 3,5 anos a plataforma de gamificação corporativa que
      processou mais de 2,4 milhões de ações e ~290 mil inscrições em
      eventos, em arquitetura de microsserviços com mensageria assíncrona.
      Implementei o motor de roletas sorteáveis, rankings e conquistas.

  - produto: Plataforma Ativus
    dominio: crédito rural e análise de crédito
    descricao: >
      Desenvolvi features de crédito rural na plataforma multi-tenant
      Ativus, que atende 79 clientes do agronegócio (Bunge, Raízen,
      BASF). Construí o gateway de Certidões Negativas de Débitos que
      acelerou a validação cadastral integrando Receita Federal, estaduais
      e Ibama.

  - produto: Corteva
    dominio: barter agrícola
    descricao: >
      Implementei marketplace de cessões de barter agrícola com
      conciliação financeira e controle de limite de crédito por trading,
      em microserviços com auditoria de alterações e Single Sign-On.

  - produto: QR-Capital
    dominio: tokenização de ativos financeiros
    descricao: >
      Implementei orquestrador de tokenizadora de ativos como cliente
      GraphQL de API externa, com persistência audítavel e OAuth2.

transversais:
  - >
    Atuei no ciclo completo de 7 sistemas em 3,5 anos: levantamento de
    requisitos com cliente, contratos de API em Swagger, desenvolvimento
    backend (Java/Spring e Go) e frontend (Angular, React, Vue), testes
    com JUnit e Mockito, deploy com Docker e suporte a produção com RCA
    de incidentes.
  - >
    Contribuí pontualmente em outros produtos: Flex-Frete (mensageria,
    React 17), RRZ (assinatura digital com auditoria, Spring Boot 3) e
    Wikle (frontend Angular).
