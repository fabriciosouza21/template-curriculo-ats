# Passagem pela itexto (Out 2021 - Abr 2025). Case principal: Weex.
empresa: itexto Consultoria em Tecnologia
cargo: Programador                              # cargo CTPS (formal, CBO 3171-10)
cargo_apresentacao: Engenheiro de Software Pleno # função real exercida (full stack)
periodo:
  inicio: 2021-10
  fim: 2025-04
local: Belo Horizonte, MG
contexto: >
  Atuação full stack em ciclo completo de software em consultoria, com
  passagem por sete domínios de negócio (gamificação corporativa, crédito
  rural, barter agrícola, fintech, logística, compliance e educação).

cases:
  - produto: Weex
    dominio: gamificação corporativa e eventos
    destaque: true    # case principal: 3,5 anos de atuação contínua
    descricao: >
      Desenvolvi por 3,5 anos a plataforma Weex de gamificação corporativa
      em ~20 microsserviços com mensageria assíncrona, geração de
      certificados em Lambda e infraestrutura como código. Implementei o
      motor de roletas, rankings, conquistas e relatórios finais de
      eventos, com frontend em Angular.

  - produto: Plataforma Ativus
    dominio: crédito rural e análise de crédito
    descricao: >
      Construí features de crédito rural na plataforma Ativus, incluindo
      o gateway de 8 tipos de Certidões Negativas de Débitos com
      integração orquestrada e processamento assíncrono via mensageria.
      Backend Spring e frontend Angular.

  - produto: Corteva
    dominio: barter agrícola
    descricao: >
      Implementei sistema de barter agrícola em microserviços com
      descoberta de serviços e comunicação entre APIs, Vue 2, PostgreSQL
      com auditoria de alterações e Single Sign-On. Inclui marketplace de
      cessões e conciliação financeira.

  - produto: QR-Capital
    dominio: tokenização de ativos financeiros
    descricao: >
      Implementei orquestrador de tokenizadora de ativos como cliente
      GraphQL de API externa, com persistência audítavel e OAuth2.

transversais:
  - >
    Participei do ciclo completo de 7 sistemas em 3,5 anos: requisitos
    com cliente, contratos de API em Swagger, desenvolvimento backend
    (Java/Spring e Go) e frontend (Angular, React, Vue), testes com JUnit
    e Mockito, deploy com Docker e suporte a produção com RCA de
    incidentes.
  - >
    Contribuí pontualmente em outros produtos: Flex-Frete (mensageria,
    React 17), RRZ (assinatura digital com auditoria, Spring Boot 3) e
    Wikle (frontend Angular).
